name: Prebuild

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prebuild-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  handshake:
    name: Handshake (${{ matrix.os }})
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:package
      - run: npm run test:handshake:build
      - run: node test/handshake/run.mjs spurious-wake
        timeout-minutes: 2
      - run: node test/handshake/run.mjs early-failure
        timeout-minutes: 2
      - run: node test/handshake/run.mjs enabled-then-successful-exit
        timeout-minutes: 2

  prebuild:
    name: Prebuild (${{ matrix.platform }}-${{ matrix.arch }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin
            arch: arm64
          - os: macos-15-intel
            platform: darwin
            arch: x64
          - os: windows-2025
            platform: win32
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm run apply-libuiohook-patch
      - run: npm ci --ignore-scripts
      - run: npm run build-ts
      - run: npm run prebuild -- --arch ${{ matrix.arch }}
      - run: >-
          node -e "require('node:fs').rmSync('build', { recursive: true, force: true })"
      - run: npm run test:node
      - run: npm run test:electron
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: prebuild-${{ matrix.platform }}-${{ matrix.arch }}
          path: prebuilds
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package
    needs:
      - handshake
      - prebuild
    outputs:
      tarball_name: ${{ steps.tarball.outputs.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: prebuild-*
          path: prebuilds
          merge-multiple: true
      - run: npm run apply-libuiohook-patch
      - run: npm ci --ignore-scripts
      - run: npm run test:listener-exception
      - run: npm run build-ts
      - run: npm run test:package
      - run: npm pack
      - name: Locate package tarball
        id: tarball
        shell: bash
        run: |
          tarball_path="$(node scripts/find-package-tarball.mjs)"
          printf 'name=%s\n' "$(basename "$tarball_path")" >> "$GITHUB_OUTPUT"
          printf 'path=%s\n' "$tarball_path" >> "$GITHUB_OUTPUT"
      - name: Verify installable package contents
        shell: bash
        env:
          PACKAGE_TARBALL: ${{ steps.tarball.outputs.path }}
        run: |
          package_root="$RUNNER_TEMP/uiohook-package"
          npm install --prefix "$package_root" --ignore-scripts "$PACKAGE_TARBALL"
          node scripts/verify-package.mjs "$package_root/node_modules/uiohook-napi"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: package
          path: ${{ steps.tarball.outputs.path }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release
    needs:
      - package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Verify release tag
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TARBALL_NAME: ${{ needs.package.outputs.tarball_name }}
        run: |
          expected_tarball="uiohook-napi-${TAG#v}.tgz"
          if [[ "$TARBALL_NAME" != "$expected_tarball" ]]; then
            echo "::error::Release tag $TAG does not match package tarball $TARBALL_NAME"
            exit 1
          fi

          tag_ref="$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" \
            --jq '.object | [.type, .sha] | @tsv')"
          IFS=$'\t' read -r tag_type tag_object <<< "$tag_ref"
          if [[ "$tag_type" != "tag" || -z "$tag_object" ]]; then
            echo "::error::Release tag $TAG must be annotated and signed"
            exit 1
          fi

          tag_details="$(gh api "repos/$GH_REPO/git/tags/$tag_object" \
            --jq '[.tag, .object.type, .object.sha, .verification.verified, .verification.reason] | @tsv')"
          IFS=$'\t' read -r signed_tag target_type target_commit verified reason <<< "$tag_details"
          if [[ "$signed_tag" != "$TAG" || "$target_type" != "commit" ]]; then
            echo "::error::Release tag $TAG does not directly identify the expected commit"
            exit 1
          fi
          if [[ "$verified" != "true" ]]; then
            echo "::error::Release tag $TAG is not verified (${reason:-unknown})"
            exit 1
          fi

          comparison="$(gh api "repos/$GH_REPO/compare/$target_commit...master" --jq .status)"
          if [[ "$comparison" != "ahead" && "$comparison" != "identical" ]]; then
            echo "::error::Release tag $TAG does not target a commit in master history"
            exit 1
          fi
      - name: Download package artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: package
          path: release
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/${{ needs.package.outputs.tarball_name }}
      - name: Create or update draft release
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PACKAGE_TARBALL: release/${{ needs.package.outputs.tarball_name }}
          TAG: ${{ github.ref_name }}
        run: |
          if is_draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$is_draft" != "true" ]]; then
              echo "::error::Release $TAG is already published"
              exit 1
            fi

            gh release upload "$TAG" "$PACKAGE_TARBALL" --clobber
          else
            gh release create "$TAG" "$PACKAGE_TARBALL" \
              --draft \
              --notes-from-tag \
              --title "uiohook-napi ${TAG#v}" \
              --verify-tag
          fi
